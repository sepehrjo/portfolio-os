<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" font-family="'Geist','Inter',sans-serif">
  <!-- App background -->
  <rect width="800" height="550" fill="#0F1115"/>
  <rect width="800" height="550" fill="url(#glow)"/>
  <defs>
    <radialGradient id="glow" cx="78%" cy="12%" r="80%">
      <stop offset="0%" stop-color="#E6B056" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#E6B056" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Top bar -->
  <circle cx="40" cy="44" r="5" fill="#E6B056"/>
  <text x="56" y="49" fill="#ECECEC" font-size="18" font-weight="700">AI Outreach System</text>
  <rect x="640" y="32" width="120" height="26" rx="13" fill="none" stroke="#E6B056" stroke-opacity="0.45"/>
  <text x="700" y="49" fill="#E6B056" font-size="12" font-weight="600" text-anchor="middle" font-family="'Geist Mono',monospace">DRAFT MODE</text>
  <line x1="32" y1="74" x2="768" y2="74" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- Left card: target company -->
  <rect x="32" y="100" width="340" height="400" rx="16" fill="#16191F" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="56" y="138" fill="#8A8F98" font-size="12" font-weight="600" font-family="'Geist Mono',monospace">01 · TARGET COMPANY</text>

  <text x="56" y="178" fill="#8A8F98" font-size="13">Company name</text>
  <rect x="56" y="190" width="292" height="44" rx="9" fill="#0F1115" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <text x="72" y="217" fill="#C9CDD4" font-size="14">Acme Logistics Inc.</text>

  <text x="56" y="262" fill="#8A8F98" font-size="13">Website URL</text>
  <rect x="56" y="274" width="292" height="44" rx="9" fill="#0F1115" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <text x="72" y="301" fill="#C9CDD4" font-size="14" font-family="'Geist Mono',monospace">https://acmelogistics.com</text>

  <rect x="56" y="346" width="292" height="46" rx="9" fill="#E6B056"/>
  <text x="202" y="375" fill="#1A1407" font-size="15" font-weight="700" text-anchor="middle">Research &amp; draft  →</text>

  <!-- pipeline steps -->
  <circle cx="64" cy="432" r="4" fill="#E6B056"/>
  <text x="80" y="437" fill="#C9CDD4" font-size="12.5">Reads the site &amp; figures out what they do</text>
  <circle cx="64" cy="462" r="4" fill="#E6B056"/>
  <text x="80" y="467" fill="#C9CDD4" font-size="12.5">Writes a personalised cold email</text>

  <!-- connector -->
  <path d="M372 300 H402" stroke="#E6B056" stroke-opacity="0.5" stroke-width="2" fill="none"/>
  <path d="M398 295 l8 5 -8 5" stroke="#E6B056" stroke-opacity="0.7" stroke-width="2" fill="none"/>

  <!-- Right card: draft -->
  <rect x="428" y="100" width="340" height="400" rx="16" fill="#16191F" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="452" y="138" fill="#8A8F98" font-size="12" font-weight="600" font-family="'Geist Mono',monospace">02 · PERSONALISED DRAFT</text>

  <text x="452" y="174" fill="#ECECEC" font-size="14" font-weight="600">Subject: A faster build for Acme</text>
  <line x1="452" y1="188" x2="744" y2="188" stroke="#FFFFFF" stroke-opacity="0.07"/>

  <rect x="452" y="206" width="250" height="11" rx="5.5" fill="#FFFFFF" fill-opacity="0.16"/>
  <rect x="452" y="228" width="292" height="11" rx="5.5" fill="#FFFFFF" fill-opacity="0.12"/>
  <rect x="452" y="250" width="276" height="11" rx="5.5" fill="#FFFFFF" fill-opacity="0.12"/>
  <rect x="452" y="272" width="232" height="11" rx="5.5" fill="#FFFFFF" fill-opacity="0.12"/>
  <rect x="452" y="306" width="200" height="11" rx="5.5" fill="#E6B056" fill-opacity="0.55"/>
  <rect x="452" y="328" width="160" height="11" rx="5.5" fill="#FFFFFF" fill-opacity="0.12"/>

  <rect x="452" y="430" width="150" height="46" rx="9" fill="none" stroke="#E6B056" stroke-opacity="0.55"/>
  <text x="527" y="459" fill="#E6B056" font-size="14" font-weight="700" text-anchor="middle">Review &amp; send</text>
  <text x="624" y="459" fill="#8A8F98" font-size="13">Human-in-the-loop</text>
</svg>
